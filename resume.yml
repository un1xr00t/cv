      Used Bash scripting to automate agent installation and registration across endpoints.
    highlights:
      - Configured ossec.conf and wazuh.yml for SSH brute-force detection
      - Applied custom active response actions to block malicious IPs
      - Implemented UFW firewall rules for segmentation
    keywords:
      - Wazuh
      - SIEM
      - Linux
      - Bash
      - Security Monitoring
    url: https://github.com/un1xr00t

  - name: Linux Log Monitoring & Alerting Lab
    description: >-
      Created a lab environment to simulate host-based intrusion detection using native Linux log files.
